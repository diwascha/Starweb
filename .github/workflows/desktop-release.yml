# Builds the Windows desktop app and publishes it as a GitHub Release with
# the signed update file (latest.json) that "Check for updates" reads.
#
# Runs on every push to main (docs-only changes excepted), and can also be
# started by hand from GitHub -> Actions -> "Desktop release" -> Run workflow.
# The version is numbered automatically: the latest v1.0.N release plus one
# (1.0.1, 1.0.2, ...), so nothing needs editing first. See docs/DESKTOP_RELEASES.md.
name: Desktop release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

# Two releases started together would pick the same number; run one at a time.
# Pushes that arrive while one is building wait, and only the newest of them
# is built after it (GitHub keeps one pending run per group).
concurrency:
  group: desktop-release
  cancel-in-progress: false

# Third-party steps are pinned to exact commits: this job holds the update
# signing key, and a moved tag on a hijacked action could steal it and sign a
# malicious update for every installed copy. Bump the SHAs deliberately.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Pick the next version (1.0.1, 1.0.2, ...)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '[.[].tagName | select(test("^v1\\.0\\.[0-9]+$")) | ltrimstr("v1.0.") | tonumber] | max // 0')
          next="1.0.$((last + 1))"
          echo "Releasing $next"
          # Only for this build; the app and latest.json take their version from package.json.
          npm pkg set version="$next"
          echo "APP_VERSION=$next" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'StarSutra v__VERSION__'
          releaseBody: 'Open StarSutra and click the "Check for updates" icon in the sidebar to install.'
          # Built as a draft so "Check for updates" keeps seeing the previous
          # complete release until every file (incl. latest.json) is uploaded.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Publish the release (all files are uploaded)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
