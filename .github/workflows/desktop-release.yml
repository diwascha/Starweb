# Builds the Windows desktop app and publishes it as a GitHub Release with
# the signed update file (latest.json) that "Check for updates" reads.
#
# Start it from GitHub -> Actions -> "Desktop release" -> Run workflow (on main),
# or by pushing a tag like v0.2.0. The release is tagged v<version from
# package.json>, so bump "version" there first. See docs/DESKTOP_RELEASES.md.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'StarSutra v__VERSION__'
          releaseBody: 'Open StarSutra and click the "Check for updates" icon in the sidebar to install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
